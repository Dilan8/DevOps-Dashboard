version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging into DockerHub to avoid rate limit..."
      - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - echo "Logging in to Amazon ECR..."
      - aws --version
      - echo "Getting AWS Account ID"
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - IMAGE_REPO_NAME=$REPOSITORY_NAME
      - IMAGE_TAG=latest
      - REGION=$REGION
      - ECR_REGISTRY="$ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com"
      - echo "Logging into ECR: $ECR_REGISTRY"
      - aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

  build:
    commands:
      - echo "Building Docker image..."
      - docker build -t $IMAGE_REPO_NAME:$IMAGE_TAG ./dashboard_ui
      - docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $ECR_REGISTRY/$IMAGE_REPO_NAME:$IMAGE_TAG

  post_build:
    commands:
      - echo "Pushing Docker image to ECR..."
      - docker push $ECR_REGISTRY/$IMAGE_REPO_NAME:$IMAGE_TAG
      - echo "Image successfully pushed!"

artifacts:
  files:
    - '**/*'
